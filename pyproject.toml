[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tuya-local-key"
version = "2.1.0"
description = "List your Smart Life / Tuya devices via QR-code login (no developer account needed)."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "tuya-device-sharing-sdk>=0.2.15",
    "qrcode[pil]>=7.4",
    "cryptography>=41.0",
]

[project.scripts]
tuya-local-key = "tuya_devices:main"
tuya-devices = "tuya_devices:main"

[tool.pytest.ini_options]
markers = [
    "ui: browser smoke tests; need playwright and a Chromium-family browser",
]

[tool.setuptools]
py-modules = ["tuya_devices"]
