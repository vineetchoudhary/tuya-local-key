name: Tuya Local Key
version: "1.0.0"
slug: tuya_local_key
description: Retrieve Smart Life / Tuya device local keys with QR-code login.
url: https://github.com/vineetchoudhary/tuya-local-key
arch:
  - aarch64
  - amd64
image: ghcr.io/vineetchoudhary/tuya-local-key
legacy: true
init: false
startup: application
boot: manual
ingress: true
ingress_port: 8000
ingress_entry: /
panel_icon: mdi:key-wireless
panel_title: Tuya Local Key
panel_admin: true
ports:
  8000/tcp: null
ports_description:
  8000/tcp: Direct web UI port, optional when not using ingress.
environment:
  SESSION_FILE: /data/session.json
  QR_SCHEME: smartlife
  PORT: "8000"
schema: false
