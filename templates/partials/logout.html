<!-- LOG OUT CONFIRMATION -->
<dialog id="logoutDialog" class="confirm" aria-labelledby="logoutTitle" aria-describedby="logoutText">
  <form method="dialog">
    <h2 id="logoutTitle">Log out?</h2>
    <p id="logoutText">This removes your login, the saved device list with its local keys, and the network scan results from this app. Device exclusions are kept for your account. To see your devices again, log in with a new QR code from the Smart Life app.</p>
    <div class="confirm-actions">
      <button id="logoutCancel" value="cancel" autofocus>Cancel</button>
      <button id="logoutConfirm" value="logout" class="danger">Log out</button>
    </div>
  </form>
</dialog>
