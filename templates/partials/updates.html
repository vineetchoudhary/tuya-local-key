<dialog id="updateDialog" class="confirm" aria-labelledby="updateDialogTitle" aria-describedby="updateDialogText">
  <form method="dialog">
    <h2 id="updateDialogTitle">Update check</h2>
    <p id="updateDialogText"></p>
    <div class="confirm-actions">
      <button id="updateDialogClose" value="close" autofocus>Close</button>
      <a id="updateDialogLink" class="update-dialog-link hidden" target="_blank" rel="noopener noreferrer">View update<span class="sr-only"> (opens in a new tab)</span></a>
    </div>
  </form>
</dialog>
