<header>
  <a id="homeLink" class="app-brand" href="./" aria-label="Tuya Local Key home">
    <img class="app-icon" src="icon.png" alt="" aria-hidden="true">
    <h1>Tuya Local Key</h1>
  </a>
  <div class="header-actions hidden" id="headerActions">
    <button id="csvBtn">Export CSV</button>
    <button id="scanBtn" aria-expanded="false" aria-controls="scanBox">Scan network</button>
    <button id="refreshBtn">Refresh</button>
    <button id="logoutBtn">Log out</button>
    <div class="more-wrap" id="moreWrap">
      <button id="moreBtn" class="icon-btn more-btn" type="button" aria-haspopup="menu"
              aria-expanded="false" aria-controls="moreMenu" aria-label="More actions" title="More actions"></button>
      <div id="moreMenu" class="more-menu hidden" role="menu" aria-label="More actions">
      </div>
    </div>
  </div>
</header>
