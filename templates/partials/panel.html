<!-- DEVICE DETAILS -->
<div id="scrim" class="scrim"></div>
<aside id="panel" class="panel" role="dialog" aria-labelledby="panelTitle" aria-hidden="true" tabindex="-1">
  <div class="panel-head">
    <div class="grow">
      <div id="panelNav" class="panel-nav hidden">
        <button id="panelBack" class="panel-back" type="button" aria-controls="panelBody"></button>
      </div>
      <h2 id="panelTitle" class="panel-title"></h2>
      <p id="panelSub" class="panel-sub"></p>
    </div>
    <button id="panelClose" class="icon-btn" type="button" aria-label="Close panel" title="Close panel"></button>
  </div>
  <div id="panelSetupEntry" class="panel-setup-entry">
    <button id="panelSetupOpen" class="panel-setup-open" type="button" aria-controls="setupBody"></button>
    <button id="panelNetworkOpen" class="panel-setup-open" type="button" aria-controls="networkBody"></button>
  </div>
  <div id="panelBody" class="panel-body" tabindex="-1"></div>
  <div id="setupBody" class="panel-body setup-body hidden" tabindex="-1"></div>
  <div id="networkBody" class="panel-body network-body hidden" tabindex="-1"></div>
</aside>
