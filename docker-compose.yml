services:
  tuya-local-key:
    image: ghcr.io/vineetchoudhary/tuya-local-key:latest
    container_name: tuya-local-key
    ports:
      - "8000:8000"
    volumes:
      - tuya-session:/data
    environment:
      - QR_SCHEME=smartlife      # or "tuyaSmart"
      # Optional login. Set BOTH to require a username + password (recommended
      # when the port is reachable beyond localhost); leave unset for no auth.
      # - AUTH_USERNAME=admin
      # - AUTH_PASSWORD=change-me
    restart: unless-stopped

volumes:
  tuya-session:
